<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Google Tag Manager — consent-gated. GTM (GA4 + Microsoft Clarity) is
         only injected after the visitor grants analytics consent via the
         cookie banner. Consent Mode defaults to denied first. The storage
         key/version here must match src/lib/consent.js. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied',
        ad_personalization: 'denied', functionality_storage: 'denied',
        personalization_storage: 'denied', security_storage: 'granted'
      });
      window.__koreLoadGtm = function () {
        if (window.__koreGtmLoaded) return;
        window.__koreGtmLoaded = true;
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-5S33Z32B');
      };
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('kore-consent') || 'null');
          if (!c || c.v !== 1) return;
          gtag('consent', 'update', {
            analytics_storage: c.analytics ? 'granted' : 'denied',
            ad_storage: c.marketing ? 'granted' : 'denied',
            ad_user_data: c.marketing ? 'granted' : 'denied',
            ad_personalization: c.marketing ? 'granted' : 'denied',
            functionality_storage: c.functional ? 'granted' : 'denied',
            personalization_storage: c.functional ? 'granted' : 'denied'
          });
          if (c.analytics) window.__koreLoadGtm();
        } catch (e) {}
      })();
    </script>
    <!-- End Google Tag Manager -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KORE 360 | Sports &amp; Event Management Company</title>
    <meta name="description" content="KORE 360 provides sports and event management, corporate events, brand activations, production, hospitality and league operations services." />
    <link rel="canonical" href="https://kore360.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KORE 360" />
    <meta property="og:title" content="KORE 360 | Sports &amp; Event Management Company" />
    <meta property="og:description" content="KORE 360 provides sports and event management, corporate events, brand activations, production, hospitality and league operations services." />
    <meta property="og:url" content="https://kore360.in/" />
    <meta property="og:image" content="https://kore360.in/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KORE 360 | Sports &amp; Event Management Company" />
    <meta name="twitter:description" content="KORE 360 provides sports and event management, corporate events, brand activations, production, hospitality and league operations services." />
    <meta name="twitter:image" content="https://kore360.in/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "KORE 360",
        "alternateName": "Kore 360",
        "url": "https://kore360.in/",
        "logo": "https://kore360.in/favicon.png",
        "founder": {
          "@type": "Person",
          "name": "Krish Lalwani"
        },
        "sameAs": [
          "https://www.instagram.com/kore360.in/"
        ],
        "slogan": "Beyond Every Angle.",
        "description": "KORE 360 is an integrated sports and event management company: sports and league management, corporate events, brand activations, production, hospitality and sponsorships, with connected education and talent divisions."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- load non-blocking: print media doesn't apply on screen, so the browser fetches it without blocking render, then onload swaps it to apply everywhere -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" /></noscript>

    <!-- Preload the homepage hero video's poster frame so the browser's
         preload scanner finds the LCP image before React/JS runs. Path must
         match HERO_POSTER in src/pages/Home.jsx. Other routes show a benign
         "preloaded but unused" note — an accepted tradeoff for the homepage
         LCP in a single-shell SPA that can't preload per-route. -->
    <link rel="preload" as="image" href="/home/hero-poster.webp" fetchpriority="high" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kore-theme-v2');
          if (stored === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          // Defaults to light mode as defined on the html tag
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
